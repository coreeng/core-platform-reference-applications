plugins {
	id 'java'
	id 'org.springframework.boot' version '4.2.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'io.cecg'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = JavaVersion.VERSION_27
	targetCompatibility = JavaVersion.VERSION_27
}

repositories {
	mavenCentral()
}

ext['logback.version'] = '1.6.8'

dependencyManagement {
	imports {
		// Keep Jackson on current patched releases until Spring Boot manages them.
		mavenBom 'com.fasterxml.jackson:jackson-bom:2.23.0'
		mavenBom 'tools.jackson:jackson-bom:3.3.0'
	}
}

configurations {
	implementations.exclude module: "spring-boot-starter-tomcat"
}
dependencies {
	implementation('org.springframework.boot:spring-boot-starter-web') {
		exclude module: 'spring-boot-starter-tomcat'
	}
	implementation('org.springframework.boot:spring-boot-starter-jetty')
	implementation('org.springframework.boot:spring-boot-starter-actuator')
	implementation('io.micrometer:micrometer-registry-prometheus')
	implementation('org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.1')
	implementation('com.google.guava:guava:33.8.0-jre')
	implementation('com.zaxxer:HikariCP:7.1.0')

	testImplementation('org.springframework.boot:spring-boot-starter-test')
}

tasks.named('test') {
	useJUnitPlatform()
}
