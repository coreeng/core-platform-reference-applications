---
name: reference-infra-cloudsql Prod
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  get-latest-version:
    uses: coreeng/p2p/.github/workflows/p2p-get-latest-image-prod.yaml@v1
    secrets:
      slack_webhook_url: ${{ secrets.P2P_SLACK_WEBHOOK_URL }}
    with:
      image-name: reference-infra-cloudsql
      tenant-name: reference-infra-cloudsql
  prod:
    needs: [get-latest-version]
    uses: coreeng/p2p/.github/workflows/p2p-workflow-prod.yaml@v1
    secrets:
      slack_webhook_url: ${{ secrets.P2P_SLACK_WEBHOOK_URL }}
      env_vars: ${{ secrets.env_vars }}
    with:
      app-name: reference-infra-cloudsql
      tenant-name: reference-infra-cloudsql
      version: ${{ needs.get-latest-version.outputs.version }}
      version-prefix: reference-infra-cloudsql/v
      skip-subnamespaces-create: true
      working-directory: reference-infra-cloudsql
