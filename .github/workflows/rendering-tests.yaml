name: Rendering Tests
on:
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/rendering-tests.yaml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rendering:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Check reference ingress rendering
        run: bash .github/scripts/tests/collect_changed_templates_test.sh
