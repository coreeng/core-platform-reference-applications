---
name: go-web Fast Feedback

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - go-web/**
  pull_request:
    branches:
      - main
    paths:
      - go-web/**

permissions:
  contents: write
  id-token: write

jobs:
  version:
    uses: coreeng/p2p/.github/workflows/p2p-version.yaml@v1
    with:
      version-prefix: go-web/v
    secrets:
      git-token: ${{ secrets.GITHUB_TOKEN }}
      slack_webhook_url: ${{ secrets.P2P_SLACK_WEBHOOK_URL }}
  fastfeedback:
    needs: [version]
    uses: coreeng/p2p/.github/workflows/p2p-workflow-fastfeedback.yaml@v1
    secrets:
      slack_webhook_url: ${{ secrets.P2P_SLACK_WEBHOOK_URL }}
      env_vars: ${{ secrets.env_vars }}
    with:
      app-name: go-web
      tenant-name: go-web
      version: ${{ needs.version.outputs.version }}
      working-directory: go-web
