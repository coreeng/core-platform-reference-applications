name: Render Templates
on:
  workflow_call:
    inputs: {}
  workflow_dispatch:
    inputs: {}

jobs:
  update-templates:
    runs-on: ubuntu-24.04
    outputs:
      latest_ref: ${{ steps.push.outputs.commit_hash }}
      changed_templates: ${{ steps.render.outputs.changed_templates }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          path: ./reference-apps
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          repository: coreeng/core-platform-software-templates
          path: ./software-templates
      - uses: robinraju/release-downloader@v1
        with:
          repository: coreeng/corectl
          latest: true
          fileName: corectl_Linux_x86_64.tar.gz
          extract: true
          out-file-path: corectl
      - id: render
        run: |
          export PATH="${PATH}:$(realpath ./corectl)"
          ./reference-apps/.github/scripts/collect_changed_templates.sh \
            -t ./software-templates \
            -r ./reference-apps \
            -o ./changed_templates.json \
            -a ./reference-apps/.github/data/args.yaml
          ct_json="$(cat ./changed_templates.json)"
          echo "Changed templates: $ct_json"
          echo "changed_templates=$ct_json" >> $GITHUB_OUTPUT
          git -C "./reference-apps" status --porcelain
      - uses: stefanzweifel/git-auto-commit-action@v7
        id: push
        with:
          repository: ./reference-apps
          commit_message: "chore: update templates"
      - name: Failure Alert
        if: failure()
        uses: slackapi/slack-github-action@v3
        with:
          webhook:  ${{ secrets.SLACK_WEBHOOK_ALERT_URL }}
          webhook-type: webhook-trigger
          payload: |
            notification: "❌ Failed to render software templates"
            workflow_link: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  p2p:
    needs: [update-templates]
    if: needs.update-templates.outputs.changed_templates != '[]'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        changed_template: ${{ fromJson(needs.update-templates.outputs.changed_templates) }}
    steps:
      - name: Run P2P workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP: ${{ matrix.changed_template }}
          REF: ${{ needs.update-templates.outputs.latest_ref }}
          DISPATCH_REF: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          dispatch_and_wait() {
            local workflow="$1"
            local run_id=""

            echo "Dispatching $workflow on $DISPATCH_REF for commit $REF"
            for attempt in {1..12}; do
              if gh workflow run "$workflow" --repo "$REPO" --ref "$DISPATCH_REF"; then
                break
              fi
              if [[ "$attempt" == "12" ]]; then
                echo "Failed to dispatch $workflow after $attempt attempts"
                exit 1
              fi
              sleep 10
            done

            for attempt in {1..30}; do
              run_id="$(gh run list \
                --repo "$REPO" \
                --workflow "$workflow" \
                --json databaseId,event,headSha \
                --jq "[.[] | select(.event == \"workflow_dispatch\" and .headSha == \"$REF\")][0].databaseId // \"\"")"
              if [[ -n "$run_id" ]]; then
                break
              fi
              sleep 10
            done

            if [[ -z "$run_id" ]]; then
              echo "Could not find workflow_dispatch run for $workflow at $REF"
              exit 1
            fi

            echo "Watching $workflow run $run_id"
            gh run watch "$run_id" --repo "$REPO" --exit-status
          }

          dispatch_and_wait "$APP-fast-feedback.yaml"
          dispatch_and_wait "$APP-extended-test.yaml"
          dispatch_and_wait "$APP-prod.yaml"

  cleanup-matrix:
    needs: [update-templates]
    if: needs.update-templates.outputs.changed_templates != '[]'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          CHANGED_TEMPLATES: ${{ needs.update-templates.outputs.changed_templates }}
          FAST_FEEDBACK: ${{ vars.FAST_FEEDBACK }}
          PROD: ${{ vars.PROD }}
        run: |
          set -euo pipefail
          matrix="$(jq -cn \
            --argjson apps "$CHANGED_TEMPLATES" \
            --argjson fast_feedback "$FAST_FEEDBACK" \
            --argjson prod "$PROD" \
            '{include: (
              [$apps[] as $app | $fast_feedback.include[] | {app: $app, stage: "integration", deploy_env: .deploy_env}] +
              [$apps[] as $app | $prod.include[] | {app: $app, stage: "prod", deploy_env: .deploy_env}]
            )}')"
          echo "Cleanup matrix: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  cleanup:
    needs: [update-templates, p2p, cleanup-matrix]
    if: always() && needs.update-templates.result == 'success' && needs.cleanup-matrix.result == 'success' && needs.update-templates.outputs.changed_templates != '[]'
    runs-on: ubuntu-24.04
    environment: ${{ matrix.deploy_env }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.cleanup-matrix.outputs.matrix) }}
    env:
      APP: ${{ matrix.app }}
      STAGE: ${{ matrix.stage }}
      DPLATFORM: ${{ vars.DPLATFORM }}
      PROJECT_ID: ${{ vars.PROJECT_ID }}
      PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
      REGION: ${{ vars.REGION || 'europe-west2' }}
      SERVICE_ACCOUNT: p2p-${{ matrix.app }}@${{ vars.PROJECT_ID }}.iam.gserviceaccount.com
      WORKLOAD_IDENTITY_PROVIDER: projects/${{ vars.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/p2p-${{ matrix.app }}/providers/p2p-${{ matrix.app }}
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          project_id: ${{ env.PROJECT_ID }}
          token_format: access_token
          access_token_lifetime: 3600s

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true

      - name: Setup kubeconfig
        uses: google-github-actions/get-gke-credentials@v3
        with:
          context_name: gke_${{ env.PROJECT_ID }}_${{ env.REGION }}_${{ env.DPLATFORM }}
          cluster_name: ${{ env.DPLATFORM }}
          location: ${{ env.REGION }}
          project_id: ${{ env.PROJECT_ID }}
          use_dns_based_endpoint: true

      - name: Scale down reference app namespace
        run: |
          set -euo pipefail
          namespace="$APP-$STAGE"

          if ! kubectl get namespace "$namespace" >/dev/null 2>&1; then
            echo "Namespace $namespace does not exist; nothing to scale down"
            exit 0
          fi

          echo "Deleting HPAs in $namespace"
          kubectl -n "$namespace" delete hpa --all --ignore-not-found

          resources="$(kubectl -n "$namespace" get deployments,statefulsets -o name 2>/dev/null || true)"
          if [[ -z "$resources" ]]; then
            echo "No deployments or statefulsets found in $namespace"
            exit 0
          fi

          echo "Scaling workloads in $namespace to zero"
          kubectl -n "$namespace" scale --replicas=0 $resources
