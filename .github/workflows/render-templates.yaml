name: Render Templates
on:
  workflow_call:
    inputs: {}
  workflow_dispatch:
    inputs:
      run_full_p2p:
        description: Run P2P for all reference apps even if templates did not change
        required: false
        type: boolean
        default: false

jobs:
  update-templates:
    runs-on: ubuntu-24.04
    outputs:
      latest_ref: ${{ steps.push.outputs.commit_hash || github.sha }}
      changed_templates: ${{ steps.render.outputs.changed_templates }}
      p2p_templates: ${{ steps.render.outputs.p2p_templates }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          path: ./reference-apps
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          repository: coreeng/core-platform-software-templates
          path: ./software-templates
      - id: render
        env:
          RUN_FULL_P2P: ${{ github.event_name == 'workflow_dispatch' && inputs.run_full_p2p }}
        run: |
          corectl_path="$(realpath ./reference-apps/.github/tools/corectl)"
          export PATH="${PATH}:${corectl_path}"
          ./reference-apps/.github/scripts/collect_changed_templates.sh \
            -t ./software-templates \
            -r ./reference-apps \
            -o ./changed_templates.json \
            -a ./reference-apps/.github/data/args.yaml
          ct_json="$(cat ./changed_templates.json)"
          if [[ "$RUN_FULL_P2P" == "true" ]]; then
            p2p_json="$(corectl template list --templates ./software-templates | jq -Rsc 'split("\n")[:-1]')"
          else
            p2p_json="$ct_json"
          fi
          echo "Changed templates: $ct_json"
          echo "P2P templates: $p2p_json"
          echo "changed_templates=$ct_json" >> "$GITHUB_OUTPUT"
          echo "p2p_templates=$p2p_json" >> "$GITHUB_OUTPUT"
          git -C "./reference-apps" status --porcelain
      - uses: stefanzweifel/git-auto-commit-action@v7
        id: push
        with:
          repository: ./reference-apps
          commit_message: "chore: update templates"
      - name: Failure Alert
        if: failure()
        uses: slackapi/slack-github-action@v3
        with:
          webhook:  ${{ secrets.SLACK_WEBHOOK_ALERT_URL }}
          webhook-type: webhook-trigger
          payload: |
            notification: "❌ Failed to render software templates"
            workflow_link: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  p2p:
    needs: [update-templates]
    if: needs.update-templates.outputs.p2p_templates != '[]'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        changed_template: ${{ fromJson(needs.update-templates.outputs.p2p_templates) }}
    steps:
      - name: Run P2P workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP: ${{ matrix.changed_template }}
          REF: ${{ needs.update-templates.outputs.latest_ref }}
          DISPATCH_REF: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          dispatch_and_wait() {
            local workflow="$1"
            local run_id=""
            local run_sha=""

            echo "Dispatching $workflow on $DISPATCH_REF for commit $REF"
            for attempt in {1..12}; do
              if run_id="$(gh api --method POST "repos/$REPO/actions/workflows/$workflow/dispatches" \
                -f ref="$DISPATCH_REF" \
                -F return_run_details=true \
                --jq '.workflow_run_id')"; then
                break
              fi
              if [[ "$attempt" == "12" ]]; then
                echo "Failed to dispatch $workflow after $attempt attempts"
                exit 1
              fi
              sleep 10
            done

            if [[ ! "$run_id" =~ ^[1-9][0-9]*$ ]]; then
              echo "Dispatch did not return a run ID for $workflow"
              exit 1
            fi

            run_sha="$(gh run view "$run_id" --repo "$REPO" --json headSha --jq '.headSha')"
            if [[ "$run_sha" != "$REF" ]]; then
              echo "$workflow run $run_id is at $run_sha, expected $REF. Start a new render run."
              exit 1
            fi

            echo "Watching $workflow run $run_id"
            gh run watch "$run_id" --repo "$REPO" --exit-status
          }

          dispatch_and_wait "reference-$APP-fast-feedback.yaml"
          dispatch_and_wait "reference-$APP-extended-test.yaml"
          dispatch_and_wait "reference-$APP-prod.yaml"
          dispatch_and_wait "reference-$APP-scheduled-security-scan.yaml"

  cleanup-matrix:
    needs: [update-templates]
    if: needs.update-templates.outputs.p2p_templates != '[]'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          P2P_TEMPLATES: ${{ needs.update-templates.outputs.p2p_templates }}
          FAST_FEEDBACK: ${{ vars.FAST_FEEDBACK }}
          EXTENDED_TEST: ${{ vars.EXTENDED_TEST }}
          PROD: ${{ vars.PROD }}
        run: |
          set -euo pipefail
          matrix="$(jq -cn \
            --argjson apps "$P2P_TEMPLATES" \
            --argjson fast_feedback "$FAST_FEEDBACK" \
            --argjson extended_test "$EXTENDED_TEST" \
            --argjson prod "$PROD" \
            '{include: (
              [$apps[] as $app | $fast_feedback.include[] | .deploy_env as $deploy_env | ["functional", "nft", "integration"][] | {app: ("reference-" + $app), stage: ., deploy_env: $deploy_env}] +
              [$apps[] as $app | $extended_test.include[] | {app: ("reference-" + $app), stage: "extended", deploy_env: .deploy_env}] +
              [$apps[] as $app | $prod.include[] | {app: ("reference-" + $app), stage: "prod", deploy_env: .deploy_env}]
            )}')"
          echo "Cleanup matrix: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  cleanup:
    needs: [update-templates, p2p, cleanup-matrix]
    if: always() && needs.update-templates.result == 'success' && needs.cleanup-matrix.result == 'success' && needs.update-templates.outputs.p2p_templates != '[]'
    runs-on: ubuntu-24.04
    environment: ${{ matrix.deploy_env }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.cleanup-matrix.outputs.matrix) }}
    env:
      APP: ${{ matrix.app }}
      STAGE: ${{ matrix.stage }}
      DPLATFORM: ${{ vars.DPLATFORM }}
      PROJECT_ID: ${{ vars.PROJECT_ID }}
      PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
      REGION: ${{ vars.REGION || 'europe-west2' }}
      SERVICE_ACCOUNT: p2p-${{ matrix.app }}@${{ vars.PROJECT_ID }}.iam.gserviceaccount.com
      WORKLOAD_IDENTITY_PROVIDER: projects/${{ vars.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/p2p-${{ matrix.app }}/providers/p2p-${{ matrix.app }}
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          project_id: ${{ env.PROJECT_ID }}
          token_format: access_token
          access_token_lifetime: 3600s

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true

      - name: Setup kubeconfig
        uses: google-github-actions/get-gke-credentials@v3
        with:
          context_name: gke_${{ env.PROJECT_ID }}_${{ env.REGION }}_${{ env.DPLATFORM }}
          cluster_name: ${{ env.DPLATFORM }}
          location: ${{ env.REGION }}
          project_id: ${{ env.PROJECT_ID }}
          use_dns_based_endpoint: true

      - name: Delete reference app subnamespace
        run: |
          set -euo pipefail
          parent_namespace="$APP"
          subnamespace="$APP-$STAGE"

          if ! kubectl get namespace "$subnamespace" >/dev/null 2>&1; then
            echo "Namespace $subnamespace does not exist; nothing to clean up"
            exit 0
          fi

          echo "Deleting subnamespace anchor $subnamespace in $parent_namespace"
          kubectl -n "$parent_namespace" delete subnamespaceanchor "$subnamespace"

          echo "Waiting for namespace $subnamespace to be deleted"
          kubectl wait --for=delete "namespace/$subnamespace" --timeout=10m
