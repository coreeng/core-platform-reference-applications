---
name: reference-python-web
description: ""
config:
  autoscaling:
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 300
      scaleUp:
        stabilizationWindowSeconds: 30
    enabled: true
    maxReplicas: 9
    minReplicas: 3
    targetCPUUtilizationPercentage: 80
  replicas: 3
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 50m
      memory: 1024Mi
